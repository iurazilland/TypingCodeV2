<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 190" width="100%" height="100%">
  <defs>
    <!-- Left Loop Front Gradient (Cyan to Vibrant Blue) -->
    <linearGradient id="leftFront" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Left Loop Under/Inner Twist Gradient (Deep Azure) -->
    <linearGradient id="leftInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Center Overpass Ribbon Gradient (Blue blending into Purple) -->
    <linearGradient id="centerOverpass" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="65%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Center Underpass Ribbon Gradient (Dark Blue into Deep Indigo) -->
    <linearGradient id="centerUnderpass" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Right Loop Front Gradient (Indigo to Purple to Fuchsia) -->
    <linearGradient id="rightFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Right Loop Under/Inner Twist Gradient (Deep Purple to Wine) -->
    <linearGradient id="rightInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <!-- Specular Highlight Gradients -->
    <linearGradient id="highlightBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="highlightPurple" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Overlap Shadow Filter -->
    <filter id="crossoverShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 3D Möbius Infinity Ribbon -->
  <g id="infinityRibbon">
    <!-- 1. Underpass Strand (Crossing underneath from bottom-right up to top-left) -->
    <path d="M174 98 C154 94 138 78 128 65 C118 52 102 36 82 32 L82 12 C110 16 130 38 142 53 C154 68 170 80 192 82 Z" fill="url(#centerUnderpass)" />

    <!-- 2. Left Loop Under/Inner Edge (Creates 3D Mobius twist effect) -->
    <path d="M82 12 C52 12 20 34 20 65 C20 84 34 98 52 103 C40 96 36 82 36 65 C36 44 56 28 82 32 Z" fill="url(#leftInner)" />

    <!-- 3. Left Loop Main Front Surface -->
    <path d="M82 32 C56 28 36 44 36 65 C36 82 48 98 72 101 C60 92 52 79 52 65 C52 48 66 36 82 32 Z" fill="url(#leftFront)" />

    <!-- 4. Left Top Specular Highlight Glint -->
    <path d="M82 14 C60 14 34 30 26 50 C32 36 56 22 80 20 Z" fill="url(#highlightBlue)" opacity="0.6" />

    <!-- 5. Right Loop Under/Inner Edge -->
    <path d="M174 98 C198 102 236 86 236 65 C236 44 218 30 192 28 C208 36 216 50 216 65 C216 84 196 96 174 80 Z" fill="url(#rightInner)" />

    <!-- 6. Overpass Strand (Crossing in FRONT with 3D drop-shadow from bottom-left to top-right) -->
    <g filter="url(#crossoverShadow)">
      <path d="M72 101 C92 98 112 82 128 65 C144 48 162 34 182 30 L188 10 C162 14 140 32 124 50 C108 68 90 82 66 84 Z" fill="url(#centerOverpass)" />
    </g>

    <!-- 7. Right Loop Main Front Surface -->
    <path d="M182 30 C206 34 220 48 220 65 C220 82 204 98 174 100 C194 94 204 80 204 65 C204 48 194 36 174 32 Z" fill="url(#rightFront)" />

    <!-- 8. Right Top Specular Highlight Glint -->
    <path d="M188 12 C212 16 232 34 234 56 C228 40 210 24 184 18 Z" fill="url(#highlightPurple)" opacity="0.5" />
  </g>

  <!-- Typography: Visual Basic in Crisp White for Dark Theme -->
  <text x="128" y="162" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="#f8fafc" letter-spacing="0.5">Visual Basic</text>
</svg>
