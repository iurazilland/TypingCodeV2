<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Tux Body Gradient -->
    <linearGradient id="tuxBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Belly Gradient -->
    <linearGradient id="tuxBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Beak & Feet Golden Gradient -->
    <linearGradient id="tuxGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Circular Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Circular Badge Outline (Gives Linux emblem authority and high contrast on dark themes) -->
  <circle cx="64" cy="64" r="60" fill="#182234" stroke="url(#badgeGrad)" stroke-width="4.5" />
  <!-- Subtle Inner Ring -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Left Webbed Foot -->
  <ellipse cx="44" cy="107" rx="16" ry="8" fill="url(#tuxGold)" transform="rotate(-8 44 107)" />
  <circle cx="34" cy="108" r="3" fill="#fbbf24" />
  <circle cx="43" cy="111" r="3.5" fill="#fbbf24" />
  <circle cx="52" cy="110" r="3" fill="#fbbf24" />

  <!-- Right Webbed Foot -->
  <ellipse cx="84" cy="107" rx="16" ry="8" fill="url(#tuxGold)" transform="rotate(8 84 107)" />
  <circle cx="94" cy="108" r="3" fill="#fbbf24" />
  <circle cx="85" cy="111" r="3.5" fill="#fbbf24" />
  <circle cx="76" cy="110" r="3" fill="#fbbf24" />

  <!-- Left Flipper / Wing -->
  <path d="M40 50 C26 56 16 70 18 86 C19 92 24 94 30 91 C38 85 46 72 47 62 Z" fill="url(#tuxBody)" stroke="#475569" stroke-width="1.2" />

  <!-- Right Flipper / Wing -->
  <path d="M88 50 C102 56 112 70 110 86 C109 92 104 94 98 91 C90 85 82 72 81 62 Z" fill="url(#tuxBody)" stroke="#475569" stroke-width="1.2" />

  <!-- Main Body & Head (Plump, Cute Penguin with crisp outline) -->
  <path d="M64 16 C48 16 38 28 38 43 C38 51 40 57 36 66 C30 79 31 93 42 102 C49 108 79 108 86 102 C97 93 98 79 92 66 C88 57 90 51 90 43 C90 28 80 16 64 16 Z" fill="url(#tuxBody)" stroke="#64748b" stroke-width="1.5" />

  <!-- Crisp White Belly -->
  <path d="M64 53 C50 53 44 65 44 80 C44 94 51 103 64 103 C77 103 84 94 84 80 C84 65 78 53 64 53 Z" fill="url(#tuxBelly)" />

  <!-- Big Friendly White Eyes -->
  <ellipse cx="54" cy="35" rx="7.5" ry="10" fill="#ffffff" />
  <ellipse cx="74" cy="35" rx="7.5" ry="10" fill="#ffffff" />

  <!-- Black Pupils -->
  <ellipse cx="56.5" cy="35.5" rx="4" ry="6" fill="#09090b" />
  <ellipse cx="71.5" cy="35.5" rx="4" ry="6" fill="#09090b" />

  <!-- Eye Highlights (Gleam) -->
  <circle cx="58" cy="32.5" r="1.5" fill="#ffffff" />
  <circle cx="73" cy="32.5" r="1.5" fill="#ffffff" />

  <!-- Classic Golden Orange Diamond Beak -->
  <path d="M48 43 C48 40 80 40 80 43 C82 49 74 58 64 60 C54 58 46 49 48 43 Z" fill="url(#tuxGold)" stroke="#b45309" stroke-width="1" />
  <path d="M52 44 C56 42 72 42 76 44 C72 47 68 49 64 49 C60 49 56 47 52 44 Z" fill="#fef08a" opacity="0.7" />
</svg>